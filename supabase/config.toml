project_id = "attendance-system"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["exp://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[storage]
enabled = true

[functions.submit-attendance]
verify_jwt = true

[functions.review-attendance]
verify_jwt = true

[functions.generate-qr]
verify_jwt = true

[functions.send-notification]
verify_jwt = true

[functions.verify-student-registration]
verify_jwt = false

[functions.resolve-student-login]
verify_jwt = false
